<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login/Register Form -->
        <div id="auth-form" class="form-container">
            <h1>Task Manager</h1>
            <div id="login-form">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button onclick="login()">Login</button>
                <p>Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
            </div>
            <div id="register-form" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button onclick="register()">Register</button>
                <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
            </div>
        </div>

        <!-- Main App (hidden until login) -->
        <div id="main-app" style="display: none;">
            <header>
                <h1>My Tasks</h1>
                <button onclick="logout()">Logout</button>
            </header>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <input type="text" id="search-input" placeholder="Search tasks...">
                <select id="status-filter">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                <select id="priority-filter">
                    <option value="">All Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button onclick="applyFilters()">Filter</button>
            </div>

            <!-- Task List -->
            <div id="task-list"></div>

            <!-- Add Task Form -->
            <div class="add-task-form">
                <input type="text" id="new-task-title" placeholder="Task title">
                <input type="text" id="new-task-description" placeholder="Description (optional)">
                <select id="new-task-priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <input type="datetime-local" id="new-task-deadline">
                <button onclick="addTask()">Add Task</button>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
